apiVersion: v1
kind: Pod

metadata:
  name: expense-resource

spec:
  containers:
    - name: nginx
      image: nginx

      resources:
        requests:
          memory: "64MI"
          #mebibytes
          cpu: "250M"
          #millicpu
          

        limits:
          memory: "128MI"
          cpu: "1000M"
          


